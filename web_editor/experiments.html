<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiments</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar__titleWrap">
          <div class="topbar__title">Experiments</div>
          <div id="expStatus" class="topbar__fileInfo"></div>
        </div>
        <div class="topbar__actions">
          <div id="moneyScore" class="topbar__fileInfo" style="margin-right: 10px;"></div>
          <button id="resetMoneyBtn" class="btn btn--secondary">Reset $</button>
          <button id="backToEditorBtn" class="btn btn--secondary">Editor</button>
        </div>
      </header>

      <div class="content">
        <div class="manageLayout" style="width: 100%;">
          <div class="sidebar">
            <section class="panel">
              <div class="panel__title">Inputs</div>

              <div class="row">
                <label class="label">Healthy</label>
                <div class="two two--btn">
                  <div id="healthyName" class="meta">No file</div>
                  <label class="btn btn--secondary btn--small">
                    Upload
                    <input id="healthyFile" type="file" accept="application/json" hidden />
                  </label>
                </div>
              </div>

              <div class="row">
                <label class="label">Sick</label>
                <div class="two two--btn">
                  <div id="sickName" class="meta">No file</div>
                  <label class="btn btn--secondary btn--small">
                    Upload
                    <input id="sickFile" type="file" accept="application/json" hidden />
                  </label>
                </div>
              </div>

              <div class="row">
                <label class="label">Ticks</label>
                <input id="ticksInput" class="input" type="number" min="0" step="1" value="100" />
              </div>

              <div class="row">
                <label class="label">Replicates</label>
                <input id="repsInput" class="input" type="number" min="1" step="1" value="3" />
              </div>

              <div class="row">
                <label class="label">Seed</label>
                <input id="seedInput" class="input" type="number" step="1" value="1" />
              </div>

              <div class="panel" style="margin-top: 12px;">
                <div class="panel__title">Interventions (sick only)</div>

                <div class="row">
                  <label class="label">Layer</label>
                  <select id="ivLayerSel" class="input"></select>
                </div>

                <div class="row">
                  <label class="label">Direction</label>
                  <select id="ivDirSel" class="input">
                    <option value="up">Up (+10% per dose)</option>
                    <option value="down">Down (-10% per dose)</option>
                  </select>
                </div>

                <div class="row">
                  <label class="label">Dose</label>
                  <div class="two two--btnLeft">
                    <button id="ivAddBtn" class="btn btn--secondary btn--small">Add</button>
                    <input id="ivDoseInput" class="input" type="number" min="0" step="0.5" value="1" />
                  </div>
                </div>

                <div class="row row--inline">
                  <div id="ivList" class="meta" style="white-space: normal;"></div>
                </div>
              </div>

              <div class="row row--inline">
                <div class="tabs">
                  <button id="tabSpatialBtn" class="tabBtn tabBtn--active">Spatial Transcriptomics/Proteomics</button>
                  <button id="tabBulkBtn" class="tabBtn">Bulk RNAseq/Proteomics/Metabolomics</button>
                  <button id="tabInVivoBtn" class="tabBtn">In Vivo Trial</button>
                </div>
              </div>

              <div id="tabSpatialPanel" class="tabPanel tabPanel--active">
                <div class="row">
                  <label class="label">Gene set</label>
                  <select id="geneSetSel" class="input"></select>
                </div>
              </div>

              <div id="tabBulkPanel" class="tabPanel">
                <div class="row">
                  <label class="label">Omics set</label>
                  <select id="omicsSetSel" class="input"></select>
                </div>
              </div>

              <div id="tabInVivoPanel" class="tabPanel">
                <div class="meta" style="margin-top: 6px;">Runs the simulation for each condition and plots Measurements over ticks.</div>
              </div>

              <div class="row row--inline">
                <div class="two two--equal">
                  <div style="display:flex; align-items:center; gap:10px;">
                    <button id="runBtn" class="btn btn--primary">Run</button>
                    <div id="runCost" class="meta"></div>
                  </div>
                  <button id="clearBtn" class="btn btn--secondary">Clear</button>
                </div>
              </div>
            </section>
          </div>

          <div class="toolsDock toolsDock--full">
            <div class="toolsBody">
              <section class="panel">
                <div class="panel__title">Output</div>
                <div id="outSummary" class="meta" style="margin-bottom: 10px;"></div>

                <div class="row row--inline">
                  <div class="four">
                    <button id="downloadJsonBtn" class="btn btn--secondary" disabled>Download JSON</button>
                    <button id="downloadTruthMatrixCsvBtn" class="btn btn--secondary" disabled>Truth Matrix</button>
                    <button id="downloadNoisyMatrixCsvBtn" class="btn btn--secondary" disabled>Noisy Matrix</button>
                    <button id="downloadMetadataCsvBtn" class="btn btn--secondary" disabled>Metadata CSV</button>
                  </div>
                </div>

                <div class="row row--inline">
                  <textarea id="outText" class="input" style="min-height: 420px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;" spellcheck="false"></textarea>
                </div>
              </section>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="experiments.js"></script>
  </body>
</html>
