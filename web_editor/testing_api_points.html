<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Testing API points</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .card { border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 14px; margin: 12px 0; }
    label { display: block; font-size: 12px; opacity: 0.85; margin: 8px 0 4px; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.2); color: inherit; }
    textarea { min-height: 160px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    button { padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: inherit; cursor: pointer; }
    button:hover { background: rgba(255,255,255,0.10); }
    pre { white-space: pre-wrap; word-break: break-word; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 14px; overflow: auto; max-height: 60vh; }
    .muted { opacity: 0.8; font-size: 12px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <h1>Testing API points</h1>
  <div class="muted">Quickly call server endpoints and inspect the raw output.</div>

  <div class="card">
    <h2 style="margin-top: 0">Defaults</h2>
    <div class="row">
      <div style="min-width: 220px; flex: 1 1 220px">
        <label for="dPlayerId">player_id</label>
        <input id="dPlayerId" value="debug" />
      </div>
      <div style="min-width: 260px; flex: 1 1 260px">
        <label for="dModel">model</label>
        <input id="dModel" value="cell_culture_cancer" />
      </div>
      <div style="min-width: 160px; flex: 0 0 160px">
        <label for="dTicks">ticks</label>
        <input id="dTicks" type="number" value="50" min="0" step="1" />
      </div>
      <div style="min-width: 160px; flex: 0 0 160px">
        <label for="dReplicates">replicates</label>
        <input id="dReplicates" type="number" value="2" min="1" step="1" />
      </div>
      <div style="min-width: 160px; flex: 0 0 160px">
        <label for="dSeed">seed</label>
        <input id="dSeed" type="number" value="1" step="1" />
      </div>
    </div>
    <div class="row">
      <div style="min-width: 320px; flex: 1 1 320px">
        <label for="dOmicsSet">omics_set (bulk_omics)</label>
        <select id="dOmicsSet"></select>
      </div>
      <div style="min-width: 320px; flex: 1 1 320px">
        <label for="dGeneSet">gene_set (spatial_tx)</label>
        <select id="dGeneSet"></select>
      </div>
      <div style="min-width: 220px; flex: 0 0 220px">
        <label>&nbsp;</label>
        <button id="btnLoadSets">Load sets</button>
      </div>
    </div>
    <div class="row">
      <div style="min-width: 240px; flex: 0 0 240px">
        <label for="dDirection">protein_screen direction</label>
        <select id="dDirection">
          <option value="up">up</option>
          <option value="down">down</option>
        </select>
      </div>
      <div style="min-width: 200px; flex: 0 0 200px">
        <label for="dDose">protein_screen dose</label>
        <input id="dDose" type="number" value="1" min="0" step="0.1" />
      </div>
      <div style="flex: 1 1 360px">
        <label class="muted" style="margin-top: 28px">Use the buttons below; these defaults will be used automatically.</label>
      </div>
    </div>
    <label for="dInterventions">interventions (JSON list, optional)</label>
    <textarea id="dInterventions" spellcheck="false">[]</textarea>
  </div>

  <div class="card">
    <h2 style="margin-top: 0">One-click API calls</h2>
    <div class="row">
      <button id="btnHealth">GET /api/health</button>
      <button id="btnModels">GET /api/tests/cancer/models</button>
      <button id="btnProteins">GET /api/tests/cancer/proteins</button>
      <button id="btnProteinLayers">GET /api/tests/cancer/protein_layers</button>
    </div>
    <div class="row">
      <button id="btnGameReset">POST /api/game/reset</button>
      <button id="btnGameState">GET /api/game/state</button>
    </div>
    <div class="row">
      <button id="btnEstimateCostBulk">POST /api/tests/cancer/estimate_cost (bulk_omics)</button>
      <button id="btnEstimateCostSpatial">POST /api/tests/cancer/estimate_cost (spatial_tx)</button>
      <button id="btnEstimateCostChar">POST /api/tests/cancer/estimate_cost (characterization)</button>
      <button id="btnEstimateCostScreen">POST /api/tests/cancer/estimate_cost (protein_screen)</button>
      <button id="btnEstimateCostCure">POST /api/tests/cancer/estimate_cost (claim_cure)</button>
    </div>
    <div class="row">
      <button id="btnBulkSets">GET /api/bulk_omics/sets</button>
      <button id="btnBulkOmics">POST /api/tests/cancer/bulk_omics</button>
    </div>
    <div class="row">
      <button id="btnGeneSets">GET /api/spatial_tx/gene_sets</button>
      <button id="btnSpatialTx">POST /api/tests/cancer/spatial_tx</button>
    </div>
    <div class="row">
      <button id="btnCharacterization">POST /api/tests/cancer/characterization</button>
      <button id="btnProteinScreen">POST /api/tests/cancer/protein_screen</button>
      <button id="btnClaimCure">POST /api/tests/cancer/claim_cure</button>
    </div>
    <div class="row">
      <button id="btnDocStatus">GET /api/doc/status</button>
      <button id="btnDocList">GET /api/doc/list</button>
      <button id="btnDocClear">POST /api/doc/clear</button>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-top: 0">Omics inventory & analysis</h2>
    <div class="row">
      <button id="btnOmicsInventory">GET /api/omics/inventory</button>
      <div style="min-width: 420px; flex: 1 1 420px">
        <label for="aPlayerId">player_id (optional; defaults to Defaults.player_id)</label>
        <input id="aPlayerId" placeholder="debug" />
      </div>
    </div>
    <div class="row">
      <div style="min-width: 420px; flex: 1 1 420px">
        <label for="aFileIds">file_ids (optional; JSON list or newline-separated)</label>
        <textarea id="aFileIds" spellcheck="false" placeholder='["ab12cd34ef56","...", "..."]'></textarea>
      </div>
    </div>
    <label for="aInstructions">instructions (required)</label>
    <textarea id="aInstructions" spellcheck="false" placeholder="Example: Load the CSVs, run PCA, and describe the top drivers."></textarea>
    <div class="row">
      <div style="min-width: 260px; flex: 1 1 260px">
        <label for="aModel">model (optional)</label>
        <input id="aModel" value="gpt-5.2" />
      </div>
      <div style="min-width: 200px; flex: 0 0 200px">
        <label for="aMemoryLimit">memory_limit</label>
        <select id="aMemoryLimit">
          <option value="1g">1g</option>
          <option value="4g" selected>4g</option>
          <option value="16g">16g</option>
          <option value="64g">64g</option>
        </select>
      </div>
      <div style="min-width: 240px; flex: 0 0 240px">
        <label>&nbsp;</label>
        <button id="btnOmicsAnalyze">POST /api/omics/analyze</button>
      </div>
    </div>
    <div class="row">
      <div style="min-width: 420px; flex: 1 1 420px">
        <label for="aRunId">legacy run_id (optional fallback)</label>
        <input id="aRunId" placeholder="(optional) paste a run_id from /api/omics/runs" />
      </div>
    </div>
    <label for="aFiles">legacy files (optional; JSON list or newline-separated)</label>
    <textarea id="aFiles" spellcheck="false" placeholder='["metadata.csv","samples/sample_1.csv"]'></textarea>
    <div class="muted">Note: /api/omics/analyze requires OPENAI_API_KEY set in the server environment (not in the browser).</div>
  </div>

  <div class="grid">
    <div class="card">
      <h2 style="margin-top: 0">Custom request</h2>

      <div class="row">
        <div style="min-width: 160px; flex: 0 0 160px">
          <label for="method">Method</label>
          <select id="method">
            <option>GET</option>
            <option>POST</option>
          </select>
        </div>
        <div style="flex: 1 1 420px">
          <label for="path">Path</label>
          <input id="path" value="/api/tests/cancer/models" />
        </div>
      </div>

      <label for="query">Query (JSON object, optional)</label>
      <textarea id="query" spellcheck="false" placeholder='{"model":"cell_culture_cancer"}'></textarea>

      <label for="body">Body (JSON object, optional)</label>
      <textarea id="body" spellcheck="false" placeholder='{"player_id":"debug","model":"cell_culture_cancer"}'></textarea>

      <div class="row" style="margin-top: 10px">
        <button id="send">Send</button>
        <button id="clear">Clear output</button>
      </div>

      <div id="meta" class="muted" style="margin-top: 10px"></div>
    </div>

    <div class="card">
      <h2 style="margin-top: 0">Output</h2>
      <div class="row" style="margin-bottom: 8px">
        <button id="tabRaw" data-tab="raw">Raw</button>
        <button id="tabLlm" data-tab="llm">LLM view</button>
      </div>
      <pre id="outRaw">(no output yet)</pre>
      <pre id="outLlm" style="display:none">(no LLM view yet)</pre>
    </div>
  </div>

  <script>
    const outRawEl = document.getElementById('outRaw');
    const outLlmEl = document.getElementById('outLlm');
    const metaEl = document.getElementById('meta');

    let _activeOutTab = 'raw';

    function setActiveOutputTab(tab) {
      const t = String(tab || '').trim().toLowerCase();
      _activeOutTab = (t === 'llm') ? 'llm' : 'raw';
      outRawEl.style.display = _activeOutTab === 'raw' ? '' : 'none';
      outLlmEl.style.display = _activeOutTab === 'llm' ? '' : 'none';
    }

    function _getElValue(id) {
      const el = document.getElementById(id);
      return el ? el.value : '';
    }

    function _getElValueNumber(id, fallback) {
      const s = String(_getElValue(id) || '').trim();
      const v = Number(s);
      return Number.isFinite(v) ? v : fallback;
    }

    function getDefaults() {
      const player_id = String(_getElValue('dPlayerId') || '').trim();
      const model = String(_getElValue('dModel') || '').trim();
      const ticks = Math.max(0, Math.floor(_getElValueNumber('dTicks', 0)));
      const replicates = Math.max(1, Math.floor(_getElValueNumber('dReplicates', 1)));
      const seed = Math.floor(_getElValueNumber('dSeed', 1));
      const omics_set = String(_getElValue('dOmicsSet') || '').trim();
      const gene_set = String(_getElValue('dGeneSet') || '').trim();
      const direction = String(_getElValue('dDirection') || 'up').trim();
      const dose = _getElValueNumber('dDose', 1);

      let interventions = [];
      try {
        const iv = safeParseJson(_getElValue('dInterventions'));
        if (Array.isArray(iv)) interventions = iv;
      } catch (e) {
        interventions = [];
      }

      return { player_id, model, ticks, replicates, seed, omics_set, gene_set, direction, dose, interventions };
    }

    function bodyBase() {
      const d = getDefaults();
      return {
        player_id: d.player_id,
        model: d.model,
        ticks: d.ticks,
        replicates: d.replicates,
        seed: d.seed,
        interventions: d.interventions,
      };
    }

    function setOutRaw(obj) {
      if (typeof obj === 'string') {
        outRawEl.textContent = obj;
        return;
      }
      try {
        outRawEl.textContent = JSON.stringify(obj, null, 2);
      } catch (e) {
        outRawEl.textContent = String(obj);
      }
    }

    function setOutLlm(text) {
      outLlmEl.textContent = String(text || '');
    }

    function _csvEscape(x) {
      const s = String(x ?? '');
      if (s.includes('"') || s.includes(',') || s.includes('\n') || s.includes('\r') || s.includes('\t')) {
        return '"' + s.replaceAll('"', '""') + '"';
      }
      return s;
    }

    function _mean(xs) {
      const a = Array.isArray(xs) ? xs : [];
      let s = 0;
      let n = 0;
      for (const v of a) {
        const f = Number(v);
        if (!Number.isFinite(f)) continue;
        s += f;
        n += 1;
      }
      return n ? (s / n) : null;
    }

    function _measurementMeansFromSample(sample, measNames) {
      const samp = Array.isArray(sample) ? sample : [];
      const names = Array.isArray(measNames) && measNames.length ? measNames : null;
      const acc = {};
      const cnt = {};
      for (const ent of samp) {
        if (!ent || typeof ent !== 'object') continue;
        const m = ent.measurements_end;
        if (!m || typeof m !== 'object') continue;
        const keys = names || Object.keys(m);
        for (const k of keys) {
          const v = Number(m[k]);
          if (!Number.isFinite(v)) continue;
          acc[k] = (acc[k] || 0) + v;
          cnt[k] = (cnt[k] || 0) + 1;
        }
      }
      const out = {};
      for (const [k, s] of Object.entries(acc)) {
        const n = cnt[k] || 0;
        out[k] = n ? (s / n) : null;
      }
      return out;
    }

    function _proteinScreenToCsv(r) {
      const measNames = Array.isArray(r.measurements) ? r.measurements.map(String) : [];
      const ctrl = r.control && typeof r.control === 'object' ? r.control : null;
      const ctrlSample = ctrl && Array.isArray(ctrl.measurements_end_sample) ? ctrl.measurements_end_sample : [];
      const ctrlMeans = _measurementMeansFromSample(ctrlSample, measNames);

      const rows0 = Array.isArray(r.results) ? r.results : [];
      const rows = [];
      for (const ent of rows0) {
        if (!ent || typeof ent !== 'object') continue;
        const prot = String(ent.protein || ent.layer || '');
        if (!prot) continue;
        const samp = Array.isArray(ent.measurements_end_sample) ? ent.measurements_end_sample : [];
        const means = _measurementMeansFromSample(samp, measNames);
        const outRow = { protein: prot };
        for (const nm of measNames) {
          const a = Number(means[nm]);
          const b = Number(ctrlMeans[nm]);
          const da = Number.isFinite(a) ? a : null;
          const db = Number.isFinite(b) ? b : null;
          outRow[`delta_${nm}`] = (da != null && db != null) ? (da - db) : null;
        }
        rows.push(outRow);
      }

      const header = ['protein', ...measNames.map((nm) => `delta_${nm}`)];
      let csv = header.map(_csvEscape).join(',') + '\n';
      const limit = 80;
      for (let i = 0; i < Math.min(limit, rows.length); i++) {
        const row = rows[i];
        const line = header.map((k) => {
          const v = row[k];
          if (v === null || v === undefined) return '';
          const f = Number(v);
          return Number.isFinite(f) ? String(f) : '';
        });
        line[0] = row.protein;
        csv += line.map(_csvEscape).join(',') + '\n';
      }
      return { csv, rows_total: rows.length, rows_emitted: Math.min(limit, rows.length) };
    }

    function _csvPreview(text, maxLines) {
      const s = String(text || '');
      const lines = s.split(/\r?\n/);
      const k = Math.max(1, Math.floor(Number(maxLines) || 10));
      return lines.slice(0, k).join('\n');
    }

    function makeLlmView(method, path, queryObj, bodyObj, httpStatus, responseJson, responseText) {
      const p = String(path || '').trim();
      const st = Number(httpStatus);
      if (!responseJson || typeof responseJson !== 'object') {
        return `LLM_VIEW\nmethod=${method} path=${p} status=${st}\n(no JSON)\n` + String(responseText || '').slice(0, 2000);
      }
      const r = responseJson;
      const exp = r.experiment ? String(r.experiment) : '';

      if (p === '/api/omics/inventory') {
        const ok = r.ok === true;
        const pid = String(r.player_id || '');
        const llmMessage = String(r.llm_message || '').trim();
        const files0 = Array.isArray(r.files) ? r.files : [];
        const groups0 = Array.isArray(r.groups) ? r.groups : [];
        let msg = '';
        msg += `Omics inventory for current game (player-centric).\n`;
        msg += `method=${method} path=${p} status=${st} ok=${String(ok)} player_id=${pid}\n`;
        if (llmMessage) {
          msg += `\n` + llmMessage + `\n`;
          return msg;
        }
        if (groups0.length) {
          msg += `\nGroups (use file_ids from a group to compare conditions/replicates):\n`;
          for (const g of groups0.slice(0, 50)) {
            if (!g || typeof g !== 'object') continue;
            const name = String(g.display_name || g.group_id || '').trim();
            const ids = Array.isArray(g.file_ids) ? g.file_ids.map(String).filter((x) => x) : [];
            msg += `- ${name} (n=${ids.length})\n`;
          }
        }
        msg += `\nFiles (pick file_id(s) to send to /api/omics/analyze):\n`;
        for (const f of files0.slice(0, 80)) {
          if (!f || typeof f !== 'object') continue;
          const id = String(f.file_id || '').trim();
          const dn = String(f.display_name || f.name || '').trim();
          const role = String(f.role || '').trim();
          if (!id) continue;
          msg += `- ${id}: ${dn}` + (role ? ` [${role}]` : '') + `\n`;
        }
        return msg;
      }

      if (p === '/api/omics/analyze') {
        const ok = r.ok === true;
        const rid = String(r.run_id || '');
        const out = String(r.output_text || '');
        const used0 = Array.isArray(r.files) ? r.files : [];
        let msg = '';
        msg += `Omics analysis via Code Interpreter.\n`;
        msg += `method=${method} path=${p} status=${st} ok=${String(ok)} run_id=${rid}\n`;
        if (used0.length) {
          msg += `\nFiles used:\n`;
          for (const f of used0.slice(0, 80)) {
            if (!f || typeof f !== 'object') continue;
            const dn = String(f.display_name || f.name || '').trim();
            const fid = String(f.file_id || '').trim();
            msg += `- ${dn}` + (fid ? ` (file_id=${fid})` : '') + `\n`;
          }
        }
        if (out) {
          msg += `\noutput_text:\n` + out + '\n';
        } else {
          msg += `\n(no output_text; inspect raw JSON for details)\n`;
        }
        return msg;
      }

      if (p === '/api/health') {
        const ok = r.ok === true;
        return ok
          ? `Server status: OK. (method=${method} status=${st})\n`
          : `Server status: ERROR. (method=${method} status=${st})\n`;
      }

      if (p === '/api/tests/cancer/models') {
        const models0 = Array.isArray(r.models) ? r.models : [];
        const desc = {
          healthy: 'This is a whole organism, an animal. If this is used for omics it will look at the gut specifically but if it is run for characterization it will show biomarkers as well as lifespan curves. Screens cannot be done in organisms since it is too expensive. This specific sample is a healthy organism, the baseline.',
          cell_culture_healthy: 'Gut-derived cells from a healthy organism. You can perform the same assays as in the gut of the organism but the characterization is showing the values of molecules in the cells that are in culture and instead of showing lifespan curves and biomarkers it will show things like confluency, division rate, cell death, etc.',
          cancer: 'This is a whole organism, an animal. If this is used for omics it will look at the gut specifically but if it is run for characterization it will show biomarkers as well as lifespan curves. Screens cannot be done in organisms since it is too expensive. This specific sample is an organism in the early stages of developing cancer and will eventually develop it.',
          cell_culture_cancer: 'Gut-derived cells from an organism with cancer. You can perform the same assays as in the gut of the organism but the characterization is showing the values of molecules in the cells that are in culture and instead of showing lifespan curves and biomarkers it will show things like confluency, division rate, cell death, etc.',
        };
        const lines = [];
        for (const ent of models0) {
          if (!ent || typeof ent !== 'object') continue;
          const k = String(ent.key || '').trim();
          if (!k) continue;
          const d = desc[k] || String(ent.label || '').trim();
          lines.push(`${k}: ${d}`);
        }
        let msg = '';
        msg += `Available models (use these exact keys in API calls):\n`;
        msg += lines.join('\n') + (lines.length ? '\n' : '');
        return msg;
      }

      if (p === '/api/game/state') {
        const g = r.game && typeof r.game === 'object' ? r.game : null;
        const usd = g && (g.money_spent_usd ?? g.money_spent_cents != null ? (Number(g.money_spent_cents) / 100.0) : null);
        const u = Number.isFinite(Number(usd)) ? Number(usd) : (g && Number.isFinite(Number(g.money_spent_usd)) ? Number(g.money_spent_usd) : 0);
        return `Game state: money spent so far = $${u.toFixed(2)}.\n`;
      }

      if (p === '/api/tests/cancer/estimate_cost') {
        const ch = r.charge && typeof r.charge === 'object' ? r.charge : null;
        const kind = ch ? String(ch.kind || '') : '';
        const samples = ch && Number.isFinite(Number(ch.samples)) ? Number(ch.samples) : null;
        const unit = ch && Number.isFinite(Number(ch.unit_cost_usd)) ? Number(ch.unit_cost_usd) : null;
        const total = ch && Number.isFinite(Number(ch.total_cost_usd)) ? Number(ch.total_cost_usd) : null;
        if (kind && samples != null && unit != null && total != null) {
          return `Estimated cost for ${kind}: $${total.toFixed(2)} total ($${unit.toFixed(2)} per sample) for ${samples} samples.\n`;
        }
        return `Estimated cost: ${kind || '(unknown experiment)'}\n`;
      }

      if (p === '/api/tests/cancer/protein_screen') {
        const model = String(r.model || '');
        const isVitro = model.startsWith('cell_culture_');
        const inv = (r.omics_inventory && typeof r.omics_inventory === 'object') ? r.omics_inventory : null;
        const invMsg = inv ? String(inv.llm_message || '').trim() : '';
        if (isVitro) {
          let msg = '';
          msg += `We ran a protein perturbation screen. Each row is a perturbation and each column is the change vs control for one measurement.\n`;
          msg += `method=${method} path=${p} status=${st} model=${model} ticks=${String(r.ticks || '')} replicates=${String(r.replicates || '')}\n`;
          if (r.run_id) {
            msg += `run_id: ${String(r.run_id)}\n`;
          }
          if (invMsg) {
            msg += `\n` + invMsg + `\n`;
            return msg;
          }
          const o = _proteinScreenToCsv(r);
          msg += `\nCSV (delta vs control):\n`;
          msg += o.csv;
          if (o.rows_total > o.rows_emitted) {
            msg += `\n(note: truncated to first ${o.rows_emitted} of ${o.rows_total} proteins)\n`;
          }
          return msg;
        }
        let msg = '';
        msg += `Protein screen (in vivo) summary.\n`;
        msg += `method=${method} path=${p} status=${st} model=${model}\n`;
        if (r.run_id) {
          msg += `run_id: ${String(r.run_id)}\n`;
        }
        if (invMsg) {
          msg += `\n` + invMsg + `\n`;
          return msg;
        }
        msg += JSON.stringify(r, null, 2);
        return msg;
      }

      if (p === '/api/tests/cancer/bulk_omics') {
        const genes = Array.isArray(r.genes) ? r.genes.map(String) : [];
        const omicsSet = String(r.omics_set || '');
        const model = String(r.model || '');
        const inv = (r.omics_inventory && typeof r.omics_inventory === 'object') ? r.omics_inventory : null;
        const invMsg = inv ? String(inv.llm_message || '').trim() : '';
        let msg = '';
        msg += `We ran bulk omics. The output is a matrix CSV with samples as rows and features as columns.\n`;
        msg += `method=${method} path=${p} status=${st} model=${model} omics_set=${omicsSet} features_n=${genes.length}\n`;
        if (invMsg) {
          msg += `\n` + invMsg + `\n`;
          return msg;
        }
        if (typeof r.matrix_noisy_csv === 'string') {
          msg += `\ncounts_csv_preview:\n` + _csvPreview(r.matrix_noisy_csv, 12) + '\n';
        }
        if (typeof r.metadata_csv === 'string') {
          msg += `\nmetadata_csv_preview:\n` + _csvPreview(r.metadata_csv, 12) + '\n';
        }
        return msg;
      }

      if (p === '/api/tests/cancer/spatial_tx') {
        const genes = Array.isArray(r.genes) ? r.genes.map(String) : [];
        const geneSet = String(r.gene_set || '');
        const inv = (r.omics_inventory && typeof r.omics_inventory === 'object') ? r.omics_inventory : null;
        const invMsg = inv ? String(inv.llm_message || '').trim() : '';
        let msg = '';
        msg += `We ran spatial omics on a grid. The output CSV has x,y coordinates plus feature columns.\n`;
        msg += `method=${method} path=${p} status=${st} gene_set=${geneSet} features_n=${genes.length}\n`;
        if (r.run_id) {
          msg += `run_id: ${String(r.run_id)}\n`;
        }
        if (invMsg) {
          msg += `\n` + invMsg + `\n`;
          return msg;
        }
        if (typeof r.matrix_noisy_csv === 'string') {
          msg += `\nmatrix_csv_preview:\n` + _csvPreview(r.matrix_noisy_csv, 12) + '\n';
        }
        if (typeof r.metadata_csv === 'string') {
          msg += `\nmetadata_csv_preview:\n` + _csvPreview(r.metadata_csv, 12) + '\n';
        }
        return msg;
      }

      if (p === '/api/tests/cancer/characterization') {
        const model = String(r.model || '');
        const meas = Array.isArray(r.measurements) ? r.measurements.map(String) : [];
        const inv = (r.omics_inventory && typeof r.omics_inventory === 'object') ? r.omics_inventory : null;
        const invMsg = inv ? String(inv.llm_message || '').trim() : '';
        let msg = '';
        msg += `We ran characterization. Measurements are timecourses; large arrays are omitted here; focus on available measurement channels and high-level outcomes.\n`;
        msg += `method=${method} path=${p} status=${st} model=${model} ticks=${String(r.ticks || '')} replicates=${String(r.replicates || '')} measurements_n=${meas.length}\n`;
        if (r.run_id) {
          msg += `run_id: ${String(r.run_id)}\n`;
        }
        if (invMsg) {
          msg += `\n` + invMsg + `\n`;
          return msg;
        }
        if (meas.length) {
          msg += `measurements: ${meas.slice(0, 40).join(', ')}${meas.length > 40 ? ' ...' : ''}\n`;
        }
        if ('median_lifespan_day' in r) {
          msg += `median_lifespan_day: ${String(r.median_lifespan_day)}\n`;
        }
        if ('median_lifespan_tick' in r) {
          msg += `median_lifespan_tick: ${String(r.median_lifespan_tick)}\n`;
        }
        return msg;
      }

      if (p === '/api/tests/cancer/claim_cure') {
        const win = r.win === true;
        const inv = (r.omics_inventory && typeof r.omics_inventory === 'object') ? r.omics_inventory : null;
        const invMsg = inv ? String(inv.llm_message || '').trim() : '';
        let msg = '';
        msg += `We ran claim_cure to evaluate whether the interventions cure cancer without harming healthy tissue.\n`;
        msg += `method=${method} path=${p} status=${st} win=${String(win)} delta_median_ticks=${String(r.delta_median_ticks ?? '')}\n`;
        if (r.run_id) {
          msg += `run_id: ${String(r.run_id)}\n`;
        }
        if (invMsg) {
          msg += `\n` + invMsg + `\n`;
          return msg;
        }
        return msg;
      }

      let msg = '';
      msg += `LLM_VIEW (no special transform for this endpoint yet)\nmethod=${method} path=${p} status=${st}\n`;
      msg += JSON.stringify(r, null, 2);
      return msg;
    }

    function safeParseJson(text) {
      const t = String(text || '').trim();
      if (!t) return null;
      return JSON.parse(t);
    }

    async function callApi(method, path, queryObj, bodyObj) {
      const t0 = performance.now();
      metaEl.textContent = '';

      let url = String(path || '/');
      if (queryObj && typeof queryObj === 'object') {
        const params = new URLSearchParams();
        for (const [k, v] of Object.entries(queryObj)) {
          if (v === null || v === undefined) continue;
          params.set(String(k), String(v));
        }
        const qs = params.toString();
        if (qs) url += (url.includes('?') ? '&' : '?') + qs;
      }

      const opts = { method: String(method || 'GET').toUpperCase(), headers: {} };
      if (opts.method === 'POST') {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(bodyObj && typeof bodyObj === 'object' ? bodyObj : {});
      }

      let resp;
      let text;
      try {
        resp = await fetch(url, opts);
        text = await resp.text();
      } catch (e) {
        const dt = Math.round(performance.now() - t0);
        metaEl.textContent = `request failed (${dt}ms): ${String(e)}`;
        setOut(String(e));
        return;
      }

      const dt = Math.round(performance.now() - t0);
      const ct = resp.headers.get('content-type') || '';

      let parsed = null;
      try {
        parsed = JSON.parse(text);
      } catch (e) {
        parsed = null;
      }

      metaEl.textContent = `status ${resp.status} (${dt}ms) content-type=${ct} bytes=${(text || '').length}`;
      setOutRaw(parsed !== null ? parsed : text);

      const llmTxt = makeLlmView(method, path, queryObj, bodyObj, resp.status, parsed, text);
      setOutLlm(llmTxt);
    }

    function wirePreset(btnId, method, path, queryObj, bodyObj) {
      document.getElementById(btnId).addEventListener('click', () => {
        callApi(method, path, queryObj || null, bodyObj || null);
      });
    }

    function wirePresetFn(btnId, method, path, queryFn, bodyFn) {
      document.getElementById(btnId).addEventListener('click', () => {
        const q = typeof queryFn === 'function' ? queryFn() : null;
        const b = typeof bodyFn === 'function' ? bodyFn() : null;
        callApi(method, path, q || null, b || null);
      });
    }

    async function loadSets() {
      const omicsSel = document.getElementById('dOmicsSet');
      const geneSel = document.getElementById('dGeneSet');

      async function loadOne(url, sel, keyName) {
        if (!sel) return;
        let resp;
        try {
          resp = await fetch(url, { method: 'GET' });
        } catch (e) {
          return;
        }
        if (!resp) return;
        let data;
        try {
          data = await resp.json();
        } catch (e) {
          return;
        }
        const arr = data && Array.isArray(data[keyName]) ? data[keyName] : [];
        const prev = String(sel.value || '').trim();
        sel.innerHTML = '';
        const empty = document.createElement('option');
        empty.value = '';
        empty.textContent = '(none)';
        sel.appendChild(empty);
        for (const v of arr) {
          const opt = document.createElement('option');
          opt.value = String(v);
          opt.textContent = String(v);
          sel.appendChild(opt);
        }
        if (prev) {
          sel.value = prev;
        }
        if (!sel.value && arr.length) {
          sel.value = String(arr[0]);
        }
      }

      await loadOne('/api/bulk_omics/sets', omicsSel, 'sets');
      await loadOne('/api/spatial_tx/gene_sets', geneSel, 'gene_sets');
    }

    wirePreset('btnHealth', 'GET', '/api/health');
    wirePreset('btnModels', 'GET', '/api/tests/cancer/models');
    wirePresetFn('btnProteins', 'GET', '/api/tests/cancer/proteins', () => ({ model: getDefaults().model }), null);
    wirePresetFn('btnProteinLayers', 'GET', '/api/tests/cancer/protein_layers', () => ({ model: getDefaults().model }), null);

    wirePresetFn('btnGameReset', 'POST', '/api/game/reset', null, () => ({ player_id: getDefaults().player_id }));
    wirePresetFn('btnGameState', 'GET', '/api/game/state', () => ({ player_id: getDefaults().player_id }), null);

    wirePreset('btnBulkSets', 'GET', '/api/bulk_omics/sets');
    wirePreset('btnGeneSets', 'GET', '/api/spatial_tx/gene_sets');

    wirePresetFn('btnBulkOmics', 'POST', '/api/tests/cancer/bulk_omics', null, () => {
      const d = getDefaults();
      const b = bodyBase();
      b.omics_set = d.omics_set || undefined;
      return b;
    });

    wirePresetFn('btnSpatialTx', 'POST', '/api/tests/cancer/spatial_tx', null, () => {
      const d = getDefaults();
      const b = bodyBase();
      b.gene_set = d.gene_set || undefined;
      return b;
    });

    wirePresetFn('btnCharacterization', 'POST', '/api/tests/cancer/characterization', null, () => {
      const b = bodyBase();
      b.include_replicates = true;
      return b;
    });

    wirePresetFn('btnProteinScreen', 'POST', '/api/tests/cancer/protein_screen', null, () => {
      const d = getDefaults();
      const b = bodyBase();
      b.direction = d.direction;
      b.dose = d.dose;
      return b;
    });

    wirePresetFn('btnClaimCure', 'POST', '/api/tests/cancer/claim_cure', null, () => {
      const d = getDefaults();
      return {
        player_id: d.player_id,
        replicates: d.replicates,
        seed: d.seed,
        interventions: d.interventions,
      };
    });

    wirePresetFn('btnEstimateCostBulk', 'POST', '/api/tests/cancer/estimate_cost', null, () => {
      const d = getDefaults();
      return {
        player_id: d.player_id,
        model: d.model,
        experiment: 'bulk_omics',
        ticks: d.ticks,
        replicates: d.replicates,
        interventions: d.interventions,
        omics_set: d.omics_set || undefined,
      };
    });
    wirePresetFn('btnEstimateCostSpatial', 'POST', '/api/tests/cancer/estimate_cost', null, () => {
      const d = getDefaults();
      return {
        player_id: d.player_id,
        model: d.model,
        experiment: 'spatial_tx',
        ticks: d.ticks,
        replicates: d.replicates,
        interventions: d.interventions,
      };
    });
    wirePresetFn('btnEstimateCostChar', 'POST', '/api/tests/cancer/estimate_cost', null, () => {
      const d = getDefaults();
      return {
        player_id: d.player_id,
        model: d.model,
        experiment: 'characterization',
        ticks: d.ticks,
        replicates: d.replicates,
        interventions: d.interventions,
      };
    });
    wirePresetFn('btnEstimateCostScreen', 'POST', '/api/tests/cancer/estimate_cost', null, () => {
      const d = getDefaults();
      return {
        player_id: d.player_id,
        model: d.model,
        experiment: 'protein_screen',
        ticks: d.ticks,
        replicates: d.replicates,
        interventions: d.interventions,
      };
    });
    wirePresetFn('btnEstimateCostCure', 'POST', '/api/tests/cancer/estimate_cost', null, () => {
      const d = getDefaults();
      return {
        player_id: d.player_id,
        model: 'cancer',
        experiment: 'claim_cure',
        ticks: 400,
        replicates: d.replicates,
        interventions: d.interventions,
      };
    });

    wirePreset('btnDocStatus', 'GET', '/api/doc/status');
    wirePreset('btnDocList', 'GET', '/api/doc/list');
    wirePreset('btnDocClear', 'POST', '/api/doc/clear', null, {});

    wirePresetFn('btnOmicsInventory', 'GET', '/api/omics/inventory', () => {
      const d = getDefaults();
      const player_id = String(_getElValue('aPlayerId') || '').trim() || String(d.player_id || '').trim();
      return { player_id };
    }, null);
    wirePresetFn('btnOmicsAnalyze', 'POST', '/api/omics/analyze', null, () => {
      const d = getDefaults();
      const player_id = String(_getElValue('aPlayerId') || '').trim() || String(d.player_id || '').trim();
      const run_id = String(_getElValue('aRunId') || '').trim();
      const instructions = String(_getElValue('aInstructions') || '').trim();
      const model = String(_getElValue('aModel') || '').trim();
      const memory_limit = String(_getElValue('aMemoryLimit') || '').trim();

      let file_ids = null;
      const fileIdsText = String(_getElValue('aFileIds') || '').trim();
      if (fileIdsText) {
        let parsed = null;
        try {
          parsed = safeParseJson(fileIdsText);
        } catch (e) {
          parsed = null;
        }
        if (Array.isArray(parsed)) {
          file_ids = parsed.map(String).filter((s) => String(s || '').trim());
        } else {
          file_ids = fileIdsText.split(/\r?\n|,/g).map((s) => String(s || '').trim()).filter((s) => s);
        }
      }

      let files = null;
      const filesText = String(_getElValue('aFiles') || '').trim();
      if (filesText) {
        let parsed = null;
        try {
          parsed = safeParseJson(filesText);
        } catch (e) {
          parsed = null;
        }
        if (Array.isArray(parsed)) {
          files = parsed.map(String).filter((s) => String(s || '').trim());
        } else {
          files = filesText.split(/\r?\n|,/g).map((s) => String(s || '').trim()).filter((s) => s);
        }
      }

      const body = { instructions };
      if (model) body.model = model;
      if (memory_limit) body.memory_limit = memory_limit;
      if (file_ids && file_ids.length) {
        body.player_id = player_id;
        body.file_ids = file_ids;
      } else {
        if (run_id) body.run_id = run_id;
        if (files && files.length) body.files = files;
      }
      return body;
    });

    document.getElementById('btnLoadSets').addEventListener('click', () => {
      loadSets();
    });

    document.getElementById('tabRaw').addEventListener('click', () => setActiveOutputTab('raw'));
    document.getElementById('tabLlm').addEventListener('click', () => setActiveOutputTab('llm'));

    document.getElementById('send').addEventListener('click', () => {
      const method = document.getElementById('method').value;
      const path = document.getElementById('path').value;

      let queryObj = null;
      let bodyObj = null;

      const queryText = document.getElementById('query').value;
      const bodyText = document.getElementById('body').value;

      try {
        queryObj = safeParseJson(queryText);
      } catch (e) {
        setOutRaw({ error: 'Invalid query JSON', detail: String(e) });
        return;
      }

      try {
        bodyObj = safeParseJson(bodyText);
      } catch (e) {
        setOutRaw({ error: 'Invalid body JSON', detail: String(e) });
        return;
      }

      callApi(method, path, queryObj, bodyObj);
    });

    document.getElementById('clear').addEventListener('click', () => {
      metaEl.textContent = '';
      setOutRaw('(cleared)');
      setOutLlm('(cleared)');
    });

    loadSets();
    setActiveOutputTab('raw');
  </script>
</body>
